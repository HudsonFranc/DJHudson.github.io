<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Player de Músicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .control-btn:hover { background-color: #374151; }
        .control-btn:active { transform: scale(0.95); }
        .shuffle-active { color: #4f46e5; }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-gray-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col" style="height: 80vh;">
        
        <header class="p-6 bg-gray-900/50 border-b border-gray-700">
            <h1 class="text-2xl font-bold text-center mb-4">Meu Player de Músicas - DJ Hudson</h1>
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="text-center sm:text-left min-w-0 flex-1">
                    <p class="text-sm text-gray-400">Tocando agora:</p>
                    <p id="now-playing" class="font-semibold truncate" title="Nenhuma música selecionada">Nenhuma música selecionada</p>
                </div>
                <div class="flex items-center gap-2">
                    <input type="file" id="file-input" accept=".mp3" multiple class="hidden">
                    <label for="file-input" class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg transition-transform duration-200 ease-in-out transform hover:scale-105 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L6.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
                        Carregar
                    </label>
                    <button id="clear-playlist-btn" title="Limpar playlist" class="cursor-pointer bg-red-600 hover:bg-red-500 text-white font-bold p-2.5 rounded-lg transition-transform duration-200 ease-in-out transform hover:scale-105">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="p-4 bg-gray-800 border-b border-gray-700">
            <audio id="audio-player" controls class="w-full mb-4"></audio>
            <div class="flex items-center justify-center gap-6 text-gray-300">
                <button id="shuffle-btn" class="control-btn p-2 rounded-full transition-colors duration-200" title="Modo aleatório"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg></button>
                <button id="prev-btn" class="control-btn p-2 rounded-full transition-transform duration-150" title="Anterior"><svg xmlns="http://www.w.org/2000/svg" class="h-8 w-8" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg></button>
                <button id="next-btn" class="control-btn p-2 rounded-full transition-transform duration-150" title="Próxima"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" /></svg></button>
            </div>
        </div>

        <main class="flex-grow p-6 overflow-y-auto">
            <h2 class="text-xl font-semibold mb-4">Sua Playlist</h2>
            <div id="playlist" class="space-y-2">
                <p id="empty-playlist-message" class="text-gray-400 text-center py-8">Carregando músicas salvas...</p>
            </div>
        </main>
    </div>

    <script>
        // --- Elementos do DOM ---
        const fileInput = document.getElementById('file-input');
        const audioPlayer = document.getElementById('audio-player');
        const playlistElement = document.getElementById('playlist');
        const nowPlayingElement = document.getElementById('now-playing');
        const emptyPlaylistMessage = document.getElementById('empty-playlist-message');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const clearPlaylistBtn = document.getElementById('clear-playlist-btn');

        // --- Estado da Aplicação ---
        let playlist = []; 
        let currentTrackIndex = -1;
        let isShuffled = false;
        
        // --- Configuração do IndexedDB ---
        let db;
        const dbName = 'musicDB';
        const storeName = 'tracks';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);

                request.onerror = (event) => {
                    console.error("Erro ao abrir o IndexedDB:", event);
                    reject("Erro no banco de dados");
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
                    }
                };

                request.onsuccess = (event) => {
                    db = event.target.result;
                    console.log("Banco de dados aberto com sucesso.");
                    resolve(db);
                };
            });
        }

        // --- Funções do Banco de Dados ---
        
        function saveTrackToDB(file) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.add({ file: file, name: file.name });
                request.onsuccess = () => resolve(request.result);
                request.onerror = (event) => reject("Erro ao salvar a música:", event.target.error);
            });
        }

        function loadTracksFromDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result.map(item => item.file));
                request.onerror = (event) => reject("Erro ao carregar músicas:", event.target.error);
            });
        }

        function clearDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.clear();
                request.onsuccess = () => resolve();
                request.onerror = (event) => reject("Erro ao limpar o banco de dados:", event.target.error);
            });
        }


        // --- Funções do Player ---

        async function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            for (const file of files) {
                if (file.type === 'audio/mpeg') {
                    await saveTrackToDB(file);
                    playlist.push(file);
                }
            }
            renderPlaylist();
        }

        function renderPlaylist() {
            playlistElement.innerHTML = '';
            if (playlist.length === 0) {
                emptyPlaylistMessage.textContent = 'Sua playlist está vazia. Clique em "Carregar" para começar!';
                playlistElement.appendChild(emptyPlaylistMessage);
                return;
            }

            playlist.forEach((file, index) => {
                const trackElement = document.createElement('div');
                trackElement.className = 'p-4 rounded-lg cursor-pointer transition-all duration-200 flex justify-between items-center';
                trackElement.classList.toggle('bg-indigo-600', index === currentTrackIndex);
                trackElement.classList.toggle('text-white', index === currentTrackIndex);
                trackElement.classList.toggle('shadow-lg', index === currentTrackIndex);
                trackElement.classList.toggle('bg-gray-700', index !== currentTrackIndex);
                trackElement.classList.toggle('hover:bg-gray-600', index !== currentTrackIndex);
                trackElement.classList.toggle('hover:scale-[1.02]', index !== currentTrackIndex);

                trackElement.textContent = `${index + 1}. ${file.name}`;
                trackElement.dataset.index = index;
                trackElement.addEventListener('click', () => playTrack(index));
                playlistElement.appendChild(trackElement);
            });
        }

        function playTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            currentTrackIndex = index;
            const trackFile = playlist[index];
            const trackUrl = URL.createObjectURL(trackFile);
            
            audioPlayer.src = trackUrl;
            audioPlayer.play();

            nowPlayingElement.textContent = trackFile.name;
            nowPlayingElement.title = trackFile.name;
            document.title = `▶️ ${trackFile.name}`;
            renderPlaylist();
        }

        function playNextTrack() {
            if (playlist.length === 0) return;
            let nextIndex;
            if (isShuffled) {
                do {
                    nextIndex = Math.floor(Math.random() * playlist.length);
                } while (playlist.length > 1 && nextIndex === currentTrackIndex);
            } else {
                nextIndex = (currentTrackIndex + 1) % playlist.length;
            }
            playTrack(nextIndex);
        }

        function playPreviousTrack() {
            if (playlist.length === 0) return;
            if (isShuffled) {
                playNextTrack();
                return;
            }
            let prevIndex = currentTrackIndex - 1;
            if (prevIndex < 0) {
                prevIndex = playlist.length - 1;
            }
            playTrack(prevIndex);
        }
        
        function toggleShuffle() {
            isShuffled = !isShuffled;
            shuffleBtn.classList.toggle('shuffle-active', isShuffled);
        }

        async function clearPlaylist() {
            if (confirm("Você tem certeza que quer apagar todas as músicas salvas?")) {
                await clearDB();
                playlist = [];
                currentTrackIndex = -1;
                audioPlayer.src = "";
                nowPlayingElement.textContent = "Nenhuma música selecionada";
                document.title = "Meu Player de Músicas";
                renderPlaylist();
            }
        }

        // --- Inicialização ---
        async function initializeApp() {
            try {
                await initDB();
                playlist = await loadTracksFromDB();
                renderPlaylist();
            } catch (error) {
                console.error("Falha ao inicializar o app:", error);
                emptyPlaylistMessage.textContent = "Não foi possível carregar as músicas salvas.";
            }
        }

        // --- Event Listeners ---
        fileInput.addEventListener('change', handleFileSelect);
        audioPlayer.addEventListener('ended', playNextTrack);
        nextBtn.addEventListener('click', playNextTrack);
        prevBtn.addEventListener('click', playPreviousTrack);
        shuffleBtn.addEventListener('click', toggleShuffle);
        clearPlaylistBtn.addEventListener('click', clearPlaylist);

        // Inicia a aplicação
        initializeApp();

    </script>
</body>
</html>
